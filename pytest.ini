[pytest]
filterwarnings =
    # Apple Accelerate BLAS (numpy 2.x on macOS arm64) raises spurious FP
    # flags on perfectly finite matmuls (verified: X @ w on standard-normal
    # data trips "divide by zero"). Real numerical corruption still surfaces
    # as NaN VALUES, which the fail-closed gates catch. Scoped to matmul only.
    ignore:divide by zero encountered in matmul:RuntimeWarning
    ignore:overflow encountered in matmul:RuntimeWarning
    ignore:invalid value encountered in matmul:RuntimeWarning
